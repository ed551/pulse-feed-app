on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USERNAME }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            cd ~/pulse-feed-app
            git pull origin main
            npm install
            npx esbuild server.ts --bundle --platform=node --format=cjs --packages=external --outfile=dist/server.cjs
            pm2 restart backend

 HEAD
      - name: Install Dependencies
        run: |
          rm -f package-lock.json
          npm install --legacy-peer-deps
          npm install @tailwindcss/oxide-linux-x64-gnu --legacy-peer-deps

      - name: Run Linter
        continue-on-error: true
        run: npm run lint

      - name: Build the Production App
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_API_RELAY_URL: ${{ secrets.VITE_API_RELAY_URL }}

      - name: Deploy to Surge
        run: npx surge ./dist pulse-feeds.surge.sh --token ${{ secrets.SURGE_TOKEN }}

